<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>OG Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0f1430; }
  .stage { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(135deg, #0f1430 0%, #1e2550 48%, #144d67 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .blob-cyan { width: 460px; height: 460px; top: -170px; right: -120px; background: rgba(26,176,222,.38); }
  .blob-gold { width: 520px; height: 520px; bottom: -230px; left: -160px; background: rgba(236,192,84,.30); }
  .blob-teal { width: 300px; height: 300px; bottom: -120px; right: 200px; background: rgba(15,76,129,.55); }
  .shine { position: absolute; inset: 0; background-image: linear-gradient(115deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 30%); pointer-events: none; }
  .watermark { position: absolute; top: 50%; left: -30px; transform: translateY(-50%) rotate(-8deg);
    font-size: 340px; line-height: 1; opacity: .15; pointer-events: none; }
  .content { position: relative; z-index: 2; padding: 56px 72px 0 72px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1ab0de, #0e8fbd); font-size: 30px; font-weight: 800; color: #06212f; }
  .brand-name { font-size: 25px; font-weight: 800; color: #ffffff; letter-spacing: .2px; }
  .brand-tag { font-size: 16px; font-weight: 600; color: #b9c6f2; margin-top: 2px; }
  .mid { margin-top: 74px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 999px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22); color: #8fd8ef;
    font-size: 17px; font-weight: 700; }
  .title-ar { margin-top: 26px; font-size: 62px; font-weight: 800; color: #ffffff; line-height: 1.15; max-width: 820px; }
  .tagline { position: absolute; right: 72px; bottom: 52px; left: 72px; display: flex; align-items: center; justify-content: space-between;
    padding-top: 22px; border-top: 1px solid rgba(255,255,255,.14); font-size: 18px; font-weight: 600; color: #c7d2f5; }
  .tagline span { direction: ltr; display: inline-flex; align-items: center; gap: 10px; }
  #ready { display: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-gold"></div>
    <div class="blob blob-teal"></div>
    <div class="shine"></div>
    <div class="watermark" id="wm">🦷</div>

    <div class="content">
      <div class="topbar">
        <div class="brand">
          <div class="logo">غ</div>
          <div>
            <div class="brand-name">د. غدير مصطفى الحمادي</div>
            <div class="brand-tag">طبيبة أسنان | مركز الإبتسامة — صنعاء</div>
          </div>
        </div>
      </div>

      <div class="mid">
        <div class="pill" id="pill">خدماتنا</div>
        <div class="title-ar" id="tAR"></div>
      </div>

      <div class="tagline">
        <span id="tagText"></span>
        <span>📞 +967 772 003 502</span>
      </div>
    </div>
  </div>
  <div id="ready"></div>

<script>
  var DATA = [];
  function add(s, d) { DATA[s] = d; }
  add('index', {
    pill: 'خدمات طب الأسنان في صنعاء • 6 تخصصات',
    tAR: 'عناية شاملة لصحة فمك وابتسامتك',
    tEN: 'Orthodontics • Fillings • Extractions • Implants • Gum Treatment • Whitening',
    tag: 'مركز الإبتسامة — شارع الزبيري، صنعاء',
    wm: '🦷'
  });
  add('orthodontics', { pill: 'تقويم الأسنان', tAR: 'تقويم بأحدث الأجهزة العالمية لابتسامة متناسقة', tEN: 'Modern braces for a beautifully aligned smile', tag: 'خطط علاجية مخصصة لكل مريض', wm: '🦷' });
  add('cosmetic-fillings', { pill: 'الحشوات التجميلية', tAR: 'حشوات بأجود المواد تطابق لون سنك الطبيعي', tEN: 'Tooth-colored fillings that match your natural teeth', tag: 'لمسة جمالية تخفي التفاصيل', wm: '✨' });
  add('tooth-extraction', { pill: 'قلع الأسنان', tAR: 'قلع بأحدث الطرق الجراحية غير المؤلمة', tEN: 'Gentle, painless extraction — comfort first', tag: 'مراعاة كاملة لحالة المريض', wm: '🏥' });
  add('dental-implants', { pill: 'زراعة الأسنان', tAR: 'زراعة بتقنيات حديثة ونتيجة طبيعية متينة', tEN: 'Modern implants, natural & long-lasting results', tag: 'مواد عالمية وثقة تدوم', wm: '💉' });
  add('gum-treatment', { pill: 'علاج اللثة', tAR: 'عناية شاملة بصحة اللثة وعلاج جميع مشاكلها', tEN: 'Complete gum care and periodontal treatment', tag: 'أحدث الطرق العلاجية', wm: '🩺' });
  add('teeth-whitening', { pill: 'تبييض الأسنان', tAR: 'تبييض متقدم لابتسامة ناصعة البياض', tEN: 'Advanced whitening for a radiant, bright smile', tag: 'تقنيات متطورة ونتائج فورية', wm: '😊' });

  function render() {
    var key = location.hash.replace('#', '') || 'index';
    var d = DATA[key] || DATA.index;
    document.getElementById('pill').textContent = d.pill;
    document.getElementById('tAR').textContent = d.tAR;
    // document.getElementById('tagText').textContent = d.tag;
    document.getElementById('wm').textContent = d.wm;
  }
  window.addEventListener('hashchange', render);
  render();
  window.addEventListener('load', function () {
    document.fonts.ready.then(function () {
      setTimeout(function () { document.getElementById('ready').textContent = 'READY'; }, 300);
    });
  });
</script>
</body>
</html>
